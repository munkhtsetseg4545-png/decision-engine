<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decision Engine — Scoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="header-inner">
      <div class="logo-mark">DE</div>
      <div class="header-title">
        <span class="header-layer">Layer 2</span>
        <span class="header-name">Decision Engine — Scoring</span>
      </div>
      <div class="header-right">
        <div class="header-timer" id="timer">00:00</div>
        <a href="/" class="history-link">← Нүүр</a>
        <a href="/history" class="history-link">History →</a>
      </div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </header>

  <main class="main" id="tickerView">
    <div class="quiz-shell">
      <div class="ticker-card">
        <p class="ticker-label">Хувьцааны нэр (Ticker)</p>
        <input type="text" id="tickerInput" class="ticker-input" placeholder="AAPL, AMD, TSLA ..." maxlength="10" autocomplete="off">
        <p class="ticker-hint">Scoring эхлэхийн өмнө ticker оруулна уу</p>
        <button class="btn btn-primary" onclick="startQuiz()">Эхлэх →</button>
      </div>
    </div>
  </main>

  <main class="main hidden" id="quizView">
    <div class="quiz-shell">
      <div class="q-counter">
        <span id="qNum">01</span><span class="q-total"> / 10</span>
        <span class="q-ticker" id="qTicker"></span>
      </div>
      <div class="q-card">
        <div class="q-meta-row"><span class="q-cat" id="qCat"></span></div>
        <p class="q-text" id="qText"></p>
        <div class="hard-fail-notice" id="qHardFail" style="display:none;"></div>
        <div class="slider-wrap">
          <span class="slider-lo" id="sliderLo"></span>
          <div class="slider-track-wrap">
            <input type="range" min="0" max="10" step="1" value="5" id="slider" class="slider">
            <div class="slider-pips">
              <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span>
              <span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
            </div>
          </div>
          <span class="slider-hi" id="sliderHi"></span>
        </div>
        <div class="score-display">
          <span class="score-num" id="scoreNum">5</span>
          <span class="score-label">/ 10</span>
        </div>
      </div>
      <div class="nav-row">
        <button class="btn btn-ghost" id="btnBack" onclick="goBack()">← Буцах</button>
        <button class="btn btn-primary" id="btnNext" onclick="goNext()">Дараах →</button>
      </div>
    </div>
  </main>

  <main class="main hidden" id="resultView">
    <div class="result-shell">
      <div class="result-hero">
        <div class="result-score-wrap">
          <svg class="score-ring" viewBox="0 0 120 120">
            <circle class="ring-bg" cx="60" cy="60" r="52"/>
            <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
          </svg>
          <div class="result-score-inner">
            <span class="result-score-num" id="resScore">—</span>
            <span class="result-score-denom">/100</span>
          </div>
        </div>
        <div class="result-verdict">
          <div class="result-ticker-badge" id="resTicker"></div>
          <div class="verdict-badge" id="verdictBadge"></div>
          <p class="verdict-interp" id="verdictInterp"></p>
        </div>
      </div>
      <div id="hardFailWrap" style="display:none; margin-bottom:1rem;"></div>
      <div class="result-grid">
        <section class="result-section">
          <h3 class="section-heading">Category breakdown</h3>
          <div id="catBreakdown"></div>
        </section>
        <section class="result-section">
          <h3 class="section-heading">Red flags</h3>
          <div id="flagsWrap"></div>
        </section>
        <section class="result-section full-width">
          <h3 class="section-heading">Action зөвлөгөө</h3>
          <div class="sizing-box" id="sizingBox"></div>
        </section>
        <section class="result-section full-width">
          <h3 class="section-heading">Асуулт бүрийн оноо</h3>
          <div class="q-scores-grid" id="qScoresGrid"></div>
        </section>
      </div>
      <div class="nav-row centered">
        <button class="btn btn-ghost" onclick="restart()">Дахин эхлэх</button>
        <a href="/history" class="btn btn-primary">History харах →</a>
      </div>
    </div>
  </main>
</div>
<script src="/static/js/main.js"></script>
</body>
</html>
